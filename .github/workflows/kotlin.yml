name: kotlin

on:
  push:
    branches: [main]
    paths: ["packages/kotlin/**", "spec/**", ".github/workflows/kotlin.yml"]
  pull_request:
    paths: ["packages/kotlin/**", "spec/**", ".github/workflows/kotlin.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The Compose test renders off-screen with Skia, which needs these system libraries.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1 libgl1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - run: gradle test
        working-directory: packages/kotlin
