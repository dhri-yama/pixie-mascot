name: swift

on:
  push:
    branches: [main]
    paths: ["Package.swift", "packages/swift/**", "spec/**", ".github/workflows/swift.yml"]
  pull_request:
    paths: ["Package.swift", "packages/swift/**", "spec/**", ".github/workflows/swift.yml"]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
