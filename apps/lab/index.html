<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixie lab</title>
    <style>
      :root { color-scheme: light dark; --bg:#14131a; --fg:#ecebf3; --card:#1e1d27; --mut:#8c8aa0; --line:#2d2b3a; }
      @media (prefers-color-scheme: light) { :root { --bg:#f4f3f8; --fg:#1b1a24; --card:#fff; --mut:#6d6b80; --line:#dcdae8; } }
      * { box-sizing: border-box; }
      body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
      header { position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
      h1 { font-size:15px; margin:0 8px 0 0; }
      label { display:flex; gap:6px; align-items:center; color:var(--mut); }
      select, input[type=range], button { font:inherit; }
      main { padding:16px; display:grid; gap:16px; }
      textarea { width:100%; min-height:72px; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; }
      #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
      .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px; display:grid; gap:6px; justify-items:center; }
      .card svg { image-rendering:pixelated; }
      .word { font-weight:600; word-break:break-all; text-align:center; }
      .tr { color:var(--mut); font-size:11px; }
      .bar { display:grid; grid-template-columns:auto 1fr; gap:2px 6px; width:100%; font-size:10px; color:var(--mut); }
      .bar i { display:block; height:5px; border-radius:3px; background:currentColor; align-self:center; }
      #stats { color:var(--mut); }
    </style>
  </head>
  <body>
    <header>
      <h1>Pixie lab</h1>
      <label>mood <select id="mood"></select></label>
      <label>palette <select id="palette"><option value="">curated</option><option>gameboy</option><option>mono</option><option>amber</option></select></label>
      <label>size <input id="scale" type="range" min="4" max="16" value="8" /></label>
      <label><input id="animate" type="checkbox" /> bob+blink</label>
      <span id="stats"></span>
    </header>
    <main>
      <textarea id="words" spellcheck="false"></textarea>
      <div id="grid"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
